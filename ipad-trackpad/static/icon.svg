<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="stylusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Background Rounded Pad -->
  <rect x="32" y="32" width="448" height="448" rx="88" fill="#0f111a" stroke="url(#grad)" stroke-width="12" filter="url(#glow)" />
  
  <!-- Trackpad Surface Grid Accent -->
  <rect x="64" y="64" width="384" height="384" rx="64" fill="#141724" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2" stroke-dasharray="8 8" />
  
  <!-- Stylus / Pencil Graphic -->
  <g transform="translate(140, 120) rotate(25)">
    <!-- Pencil Body -->
    <rect x="0" y="30" width="36" height="180" rx="8" fill="url(#stylusGrad)" />
    <!-- Pencil Tip -->
    <polygon points="0,210 36,210 18,255" fill="#f8fafc" />
    <circle cx="18" cy="255" r="4" fill="#0f172a" />
    <!-- Pencil Cap -->
    <rect x="0" y="20" width="36" height="16" rx="4" fill="#64748b" />
  </g>
  
  <!-- Touch Ripple Circles -->
  <circle cx="310" cy="310" r="45" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.8" />
  <circle cx="310" cy="310" r="20" fill="#38bdf8" opacity="0.9" />
  <circle cx="370" cy="260" r="28" fill="none" stroke="#818cf8" stroke-width="3" opacity="0.6" />
  <circle cx="370" cy="260" r="12" fill="#818cf8" opacity="0.8" />
</svg>
