        <style>
            .studio-loader-wrapper {
                position: fixed;
                inset: 0;
                background-color: #09090b;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 99999;

                   -moz-user-select: none;

            .studio-loader-logo {
                width: 56px;
                height: 31px;
                animation: studioPulse 1.8s ease-in-out infinite;
            }
            .studio-loader-bar {
                width: 120px;
                height: 2px;
                background: #27272a;
                border-radius: 9999px;
                margin-top: 24px;
                overflow: hidden;
                position: relative;
            }
            .studio-loader-bar::after {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                height: 100%;
                width: 40%;
                background: #dc2626;
                border-radius: 9999px;
                animation: studioShimmer 1.5s ease-in-out infinite;
            }
            @keyframes studioPulse {
                0%, 100% { opacity: 0.35; transform: scale(0.96); }
                50% { opacity: 1; transform: scale(1); }
            }
            @keyframes studioShimmer {
                0% { left: -40%; }
                100% { left: 100%; }
            }
        </style>
